<!doctype html>
<html lang="es" data-look="solan" data-skin="solan" data-bgmode="grad-solan"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07345c">
<meta name="description" content="Afinador digital y analógico, escalas, acordes y progresiones para instrumentos de cuerda. Sin publicidad.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MUSICTOOL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css?v=9">
<title>MUSICTOOL</title>
</head><body>
<main>
<section id="home" class="view on">
  <div class="logo">MUSIC<b>TOOL</b></div>
  <p class="tag">Afina. Practica. Compón.</p>
  <div class="grid" id="homegrid"></div>
  <div class="pedal" id="quick-style"></div>
</section>

<section id="tuner" class="view">
  <h2>Afinador</h2>
  <select id="inst" class="sel" aria-label="Instrumento"></select>
  <div class="pedal gauge">
    <svg id="gauge" viewBox="0 0 300 165" role="img" aria-label="Medidor de afinación"></svg>
    <div class="digi-box">
      <div class="readout"><span id="note">–</span><sup id="oct"></sup></div>
      <div class="digi-strip">
        <div class="digi-cell"><span>FRECUENCIA</span><b id="hz">0.0 Hz</b></div>
        <div class="digi-cell"><span>DESVIACIÓN</span><b id="cents">0 cents</b></div>
        <div class="digi-cell"><span>OBJETIVO</span><b id="target-note">—</b></div>
      </div>
      <div class="digi-led" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i class="c"></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>
    <div id="status" class="status">Pulsa «Activar micrófono»</div>
  </div>
  <div id="strings" class="chips"></div>
  <button id="mic" class="cta" data-a="mic">Activar micrófono</button>
  <div class="pedal ref">
    <label for="a4">Referencia La4 = <b id="a4v">440</b> Hz</label>
    <input type="range" id="a4" min="430" max="450" step="1" value="440">
  </div>
  <p id="tmsg" class="msg" role="alert"></p>
</section>

<section id="scales" class="view"><h2>Escalas</h2><div id="scales-body"></div></section>
<section id="chords" class="view"><h2>Acordes</h2><div id="chords-body"></div></section>
<section id="prog" class="view"><h2>Progresiones</h2><div id="prog-body"></div></section>
<section id="settings" class="view"><h2>Configuración</h2><div id="settings-body"></div></section>
</main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script src="app.js?v=9"></script>
</body></html>
